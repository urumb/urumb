<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Case 01, flakehound. The crime: Tests that pass, then fail, with no code change. The fix: Runs them under hostile conditions and names the cause." font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace"><style></style><path d="M0 12 Q0 0 12 0 H196 L222 24 H588 Q600 24 600 36 V368 Q600 380 588 380 H12 Q0 380 0 368 Z" fill="#e9dfc7"/><text x="28" y="38" font-size="20" fill="#5c5444" letter-spacing="4" font-weight="700">CASE 01</text><g transform="translate(506.0 66) rotate(6)"><rect x="-66.0" y="-21" width="132" height="42" rx="5" fill="none" stroke="#d9412e" stroke-width="3"/><text x="0" y="7" font-size="20" fill="#d9412e" text-anchor="middle" font-weight="700" letter-spacing="1">ON PYPI</text></g><text x="28" y="118" font-size="34" fill="#0d0f0e" font-weight="700">flakehound</text><line x1="28" y1="138" x2="572" y2="138" stroke="#0d0f0e" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="28" y="172" font-size="17" fill="#d9412e" font-weight="700" letter-spacing="3">THE CRIME</text><text x="28" y="202" font-size="23" fill="#0d0f0e" >Tests that pass, then fail,</text><text x="28" y="231" font-size="23" fill="#0d0f0e" >with no code change.</text><text x="28" y="272" font-size="17" fill="#3d6b2c" font-weight="700" letter-spacing="3">THE FIX</text><text x="28" y="302" font-size="23" fill="#0d0f0e" >Runs them under hostile</text><text x="28" y="331" font-size="23" fill="#0d0f0e" >conditions and names the cause.</text><text x="28" y="362" font-size="17" fill="#5c5444" >Python / pytest / CLI</text></svg>
